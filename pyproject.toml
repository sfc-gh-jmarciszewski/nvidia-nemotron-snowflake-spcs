[project]
name = "nemotron-demo"
version = "0.1.0"
description = "NVIDIA Nemotron NIM on Snowpark Container Services demo"
requires-python = ">=3.11,<3.12"
dependencies = [
    "snowflake-snowpark-python>=1.24.0",
    "snowflake-connector-python[pandas]>=3.10.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.0.0",
]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.uv]
python-preference = "managed"
